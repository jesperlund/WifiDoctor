name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the signed bundle to Google Play'
        type: boolean
        default: false
      track:
        description: 'Play track (internal, alpha = closed testing, beta = open testing, production)'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: 'Release status. Use draft until the app has been reviewed once, then completed.'
        type: choice
        options: [draft, completed]
        default: draft

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Play needs a higher versionCode for every upload.
      VERSION_CODE: ${{ github.run_number }}
      # Empty until the signing / Play secrets are added (see README.md, "Publishing to Google Play").
      HAS_KEYSTORE: ${{ secrets.WIFIDOCTOR_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core + app)
        run: ./gradlew :core:test testDebugUnitTest --stacktrace

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for module in ("core", "app"):
              t = f = e = s = 0
              for path in glob.glob(f"{module}/build/test-results/**/*.xml", recursive=True):
                  r = ET.parse(path).getroot()
                  t += int(r.get("tests")); f += int(r.get("failures")); e += int(r.get("errors")); s += int(r.get("skipped"))
              line = f"{module}: {t} tests, {f} failures, {e} errors, {s} skipped"
              print(line)
              for path in glob.glob(f"{module}/build/test-results/**/*.xml", recursive=True):
                  for case in ET.parse(path).getroot().iter("testcase"):
                      for bad in list(case.iter("failure")) + list(case.iter("error")):
                          print(f"  FAILED {case.get('classname')} > {case.get('name')}: {(bad.get('message') or '')[:300]}")
              with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  out.write(line + "\n\n")
          PY

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wifidoctor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # ---- Release -------------------------------------------------------------------------

      - name: Restore upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.WIFIDOCTOR_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "WIFIDOCTOR_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # Always built so R8/minification problems show up on every push; signed only with the secrets.
      - name: Build release bundle (AAB) and APK
        env:
          WIFIDOCTOR_KEYSTORE_PASSWORD: ${{ secrets.WIFIDOCTOR_KEYSTORE_PASSWORD }}
          WIFIDOCTOR_KEY_ALIAS: ${{ secrets.WIFIDOCTOR_KEY_ALIAS }}
          WIFIDOCTOR_KEY_PASSWORD: ${{ secrets.WIFIDOCTOR_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload signed release
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wifidoctor-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Publish to Google Play
        if: github.event_name == 'workflow_dispatch' && inputs.publish && env.HAS_KEYSTORE == 'true' && env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.jesperlund.wifidoctor
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
